name: Jira Pipeline — stage advance

# Chains the 5-stage pipeline (spec -> impact -> dev -> qa -> security).
# Each stage's PR must be human-approved and merged (branch protection
# enforces this) before the next stage issue is opened — no auto-merge
# anywhere in this chain. After the security stage merges, this workflow
# posts a read-only release-readiness verdict instead of opening a further
# stage (there is no automated deploy in this POC).
on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  determine:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.labels.outputs.stage }}
      jira_key: ${{ steps.labels.outputs.jira_key }}
      next: ${{ steps.next.outputs.next }}
    steps:
      - name: Determine current stage + jira key from PR labels
        id: labels
        run: |
          LABELS='${{ toJson(github.event.pull_request.labels.*.name) }}'
          STAGE=$(echo "$LABELS" | jq -r '.[] | select(startswith("stage:")) | sub("stage:";"")')
          JIRA_KEY=$(echo "$LABELS" | jq -r '.[] | select(startswith("jira:")) | sub("jira:";"")')
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "jira_key=$JIRA_KEY" >> "$GITHUB_OUTPUT"

      - name: Map to next stage
        id: next
        run: |
          case "${{ steps.labels.outputs.stage }}" in
            spec) echo "next=impact" >> "$GITHUB_OUTPUT" ;;
            impact) echo "next=dev" >> "$GITHUB_OUTPUT" ;;
            dev) echo "next=qa" >> "$GITHUB_OUTPUT" ;;
            qa) echo "next=security" >> "$GITHUB_OUTPUT" ;;
            security) echo "next=" >> "$GITHUB_OUTPUT" ;;
            *) echo "next=" >> "$GITHUB_OUTPUT" ;;
          esac

  open-next-stage-issue:
    needs: determine
    if: needs.determine.outputs.next != '' && needs.determine.outputs.jira_key != ''
    permissions:
      issues: write
    uses: AIDLC-Research-1/.github-private/.github/workflows/jira-stage-issue-reusable.yaml@main
    with:
      stage: ${{ needs.determine.outputs.next }}
      jira_key: ${{ needs.determine.outputs.jira_key }}
      summary: ${{ github.event.pull_request.title }}
      requirement: "See specs/${{ needs.determine.outputs.jira_key }}.md and merged PR #${{ github.event.pull_request.number }}."
      prior_pr: "${{ github.event.pull_request.number }}"

  release-readiness-verdict:
    needs: determine
    if: needs.determine.outputs.stage == 'security' && needs.determine.outputs.jira_key != ''
    permissions:
      pull-requests: write
      contents: read
    uses: AIDLC-Research-1/.github-private/.github/workflows/release-readiness-check-reusable.yaml@main
    with:
      jira_key: ${{ needs.determine.outputs.jira_key }}
      pr_number: "${{ github.event.pull_request.number }}"
