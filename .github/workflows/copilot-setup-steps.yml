# Pre-installs the coding agent's dev container per GitHub's copilot-setup-steps convention.
name: "Copilot Setup Steps"

on: workflow_dispatch

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build (no tests)
        run: mvn -q -DskipTests package
      - name: Test
        run: mvn -q test
